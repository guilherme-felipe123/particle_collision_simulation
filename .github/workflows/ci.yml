name: CI - ML Service

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t particle-sim .

      - name: Run training (sanity check)
        run: |
          docker run --rm -e PYTHONPATH=/app particle-sim python -m ml.train

      - name: Test API startup
        run: |
          docker run --rm -d -p 8000:8000 -e PYTHONPATH=/app particle-sim \
          python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
          sleep 5
          curl -f http://localhost:8000 || exit 1
